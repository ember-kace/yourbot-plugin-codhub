name: Regression and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewed SDK and chart dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository import archive budget and file integrity
        run: python tools/check_repository_archive.py
      - name: Run regression suite
        run: python tools/dev.py test
      - name: Validate release data and SDK artifact
        run: python tools/dev.py validate
      - name: Exercise the real SDK subprocess transport
        run: python tools/stage_plugin_transport.py --report dist/transport.json
      - name: Build deterministic plugin package
        run: python tools/dev.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cod-hub-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.json
          if-no-files-found: error
